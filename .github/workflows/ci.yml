name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true


permissions:
  contents: read

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install the locked dependencies
        run: |
          python -m pip install "uv==0.12.0"
          uv sync --locked --extra dev

      - name: Lint
        run: uv run ruff check

      - name: Format check
        run: uv run ruff format --check

      # Currently no tests
      # - name: Check CI tests what it says it tests
      #   run: uv run python -m unittest

  run:
    name: Run script to publish simulation report
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install the locked dependencies
        run: |
          python -m pip install "uv==0.12.0"
          uv sync --locked

      - name: Run script
        run: |
          uv run python simulation.py

      - name: Upload report.html as artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: report
          path: _output/report.html
          archive: false
    